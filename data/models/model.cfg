class CfgSkeletons
{
    	class SPLATFenceDoubleKit_skeleton
	{
		isDiscrete=1;
		skeletonInherit="";
		SkeletonBones[]=
		{
			"placing",
			""
		};
	};
	class SPLATFenceDouble_skeleton
	{
		isDiscrete=1;
		skeletonInherit="";
		SkeletonBones[]=
		{
			"deployed",
			"",
			"base",
			"",
			"fence",
			"",
			// Lockable material slots only. Their proxy stays attached (locked) after
			// build, so the engine keeps drawing it - the type="hide" anim below is
			// what removes it. The 3 non-lockable slots are consumed on build and need
			// nothing here. isDiscrete=1: if either name has no matching (non-empty)
			// selection in SPLATFenceDouble.p3d the whole skeleton fails and ALL
			// proxies vanish - drop the offending bone if that happens.
			"Material_WoodenLogs",
			"",
			"Material_FPole_Rope",
			""
		};
	};
};

class CfgModels
{
    class Default
	{
		sections[]={};
		sectionsInherit="";
		skeletonName="";
	};
		class SPLATFenceDoubleKit_Placing: Default
	{
		skeletonName="SPLATFenceDoubleKit_skeleton";
		sections[]=
		{
			"placing"
		};
		class Animations
		{
			class Placing
			{
				type="hide";
				source="user";
				selection="placing";
				sourceAddress="clamp";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
		};
	};
	class SPLATFenceDouble: Default
	{
		skeletonName="SPLATFenceDouble_skeleton";
		sections[]=
		{
			"deployed",
			"base",
			"fence",
			"Material_WoodenLogs",
			"Material_FPole_Rope"
		};
		class Animations
		{
			class Deployed
			{
				type="hide";
				source="user";
				selection="deployed";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
			class Base
			{
				type="hide";
				source="user";
				selection="base";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
			class Fence
			{
				type="hide";
				source="user";
				selection="fence";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
			// Lockable material proxies. UpdateAttachmentVisuals() calls
			// SetAnimationPhase(<slot>, 1) when the slot locks on build -> hide.
			// selection= must equal the slot name and must exist in the .p3d.
			class Material_WoodenLogs
			{
				type="hide";
				source="user";
				selection="Material_WoodenLogs";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
			class Material_FPole_Rope
			{
				type="hide";
				source="user";
				selection="Material_FPole_Rope";
				minValue=0;
				maxValue=1;
				hideValue=0.01;
			};
		};
	};
};
